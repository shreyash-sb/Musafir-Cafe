      <stop offset="0%" stop-color="#C47D3B" />
      <stop offset="100%" stop-color="#8B4E1A" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A251C" />
